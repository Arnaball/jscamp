<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React - JobCard</title>
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>

  <body>
    <div id="root"></div>

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react?dev",
          "reactDOMClient": "https://esm.sh/react-dom/client?dev",
          "react/jsx-runtime": "https://esm.sh/react/jsx-runtime?dev"
        }
      }
    </script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel" data-type="module">
      import React from "react";
      import ReactDOMClient from "reactDOMClient";

      // Componente JobCard con múltiples props
      function JobCard({ data, titulo, empresa, ubicacion, descripcion }) {
        // Hooks
        const [isApplied, handleAplied] = React.useState(false);

        function handleClick() {
          handleAplied(!isApplied);
        }

        const text = isApplied ? "Aplicado" : "Aplicar";
        const buttonClassApply = `${isApplied ? "is-applied" : ""}?`;

        return (
          <article
            data-modalidad={data?.modalidad}
            data-nivel={data?.nivel}
            data-technology={data?.technology}
            className="job-listing-card"
          >
            <div>
              <h3>{titulo}</h3>
              <small>
                {empresa} | {ubicacion}
              </small>
              <p>{descripcion}</p>
            </div>
            <button
              disabled={isApplied}
              className={`button-apply-job ${buttonClassApply}`}
              onClick={handleClick}
            >
              {text}
            </button>
          </article>
        );
      }

      // Componente App
      function App() {
        return (
          <section>
            <h2>Empleos disponibles</h2>
            <div className="jobs-listings">
              <JobCard
                titulo="Desarrollador Frontend"
                empresa="Tech Solutions Inc."
                ubicacion="Remoto"
                descripcion="Buscamos un desarrollador frontend con experiencia en React, TypeScript y Tailwind CSS."
              />
              <JobCard
                titulo="Ingeniero de Software Senior"
                empresa="Data Driven Co."
                ubicacion="Ciudad de México"
                descripcion="Estamos buscando un ingeniero de software con experiencia en desarrollo web."
                data={{
                  modalidad: "remoto",
                  nivel: "senior",
                  technology: "react",
                }}
              />
            </div>
          </section>
        );
      }

      // Renderizar
      const rootEl = document.querySelector("#root");
      const root = ReactDOMClient.createRoot(rootEl);
      root.render(<App />);
    </script>
  </body>
</html>
